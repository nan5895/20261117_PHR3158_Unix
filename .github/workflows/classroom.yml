# GitHub Classroom 자동 채점: 학생이 push 할 때마다 bin/check 를 실행해 점수를 매깁니다 (Lab 1~4, 각 25점)
name: Autograding Tests
on: [push, workflow_dispatch, repository_dispatch]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: lab1
        id: lab1
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab1, command: bash bin/check lab1, timeout: 2, max-score: 25 }
      - name: lab2
        id: lab2
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab2, command: bash bin/check lab2, timeout: 2, max-score: 25 }
      - name: lab3
        id: lab3
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab3, command: bash bin/check lab3, timeout: 2, max-score: 25 }
      - name: lab4
        id: lab4
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab4, command: bash bin/check lab4, timeout: 2, max-score: 25 }

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          LAB1_RESULTS: "${{ steps.lab1.outputs.result }}"
          LAB2_RESULTS: "${{ steps.lab2.outputs.result }}"
          LAB3_RESULTS: "${{ steps.lab3.outputs.result }}"
          LAB4_RESULTS: "${{ steps.lab4.outputs.result }}"
        with:
          runners: lab1,lab2,lab3,lab4
