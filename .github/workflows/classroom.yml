# GitHub Classroom 자동 채점: 학생이 push 할 때마다 bin/check 를 실행해 점수를 매깁니다 (Lab 1 30점, Lab 2 40점, 숙제 30점)
name: Autograding Tests
on: [push, workflow_dispatch, repository_dispatch]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: lab1
        id: lab1
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab1, command: bash bin/check lab1, timeout: 2, max-score: 30 }
      - name: lab2
        id: lab2
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: lab2, command: bash bin/check lab2, timeout: 2, max-score: 40 }
      - name: homework
        id: hw
        uses: classroom-resources/autograding-command-grader@v1
        with: { test-name: homework, command: bash bin/check hw, timeout: 2, max-score: 30 }
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          LAB1_RESULTS: "${{ steps.lab1.outputs.result }}"
          LAB2_RESULTS: "${{ steps.lab2.outputs.result }}"
          HW_RESULTS: "${{ steps.hw.outputs.result }}"
        with:
          runners: lab1,lab2,hw
